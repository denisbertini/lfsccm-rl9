# Lustre VM on Rocky Linux 9 — Lima configuration
images:
  - location: "https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2"
    arch: "x86_64"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

firmware:
  legacyBIOS: true

cpuType:
  # Workaround for "vmx_write_mem: mmu_gva_to_gpa XXXXXXXXXXXXXXXX failed" on Intel Mac
  x86_64: "Haswell-v4"
